name: Weekly billing reconciliation

on:
  schedule:
    # Saturdays at 04:17 UTC = Friday 9:17 PM PDT (summer) / Friday 8:17 PM PST
    # (winter) in San Diego. Runs Friday EVENING so payments made during and
    # after Friday's sessions are already in Gmail when the bot reconciles —
    # the old Friday-morning slot missed them and chased clients who had paid.
    # GitHub Actions cron runs in UTC with no DST awareness; the 1-hour
    # winter shift is acceptable.
    - cron: "17 4 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print email, do not send)"
        type: boolean
        default: false
      lookback_days:
        description: "Days of history to reconcile"
        type: string
        default: "5"
      period_end:
        description: "Dry-run-only Pacific Friday YYYY-MM-DD (blank = latest Friday). Historical receipt search remains execution-relative."
        type: string
        default: ""
      email_style:
        description: "Email template"
        type: choice
        options:
          - default
          - command-center
        default: command-center
      appointment_source:
        description: "Where appointments come from (ical = proven path; vagaro-events = Phase 3 webhook feed)"
        type: choice
        options:
          - ical
          - vagaro-events
        default: ical
      billing_mode:
        description: "schedule = roster/iCal model; payment-driven = money-in + history-based chase (no schedule.csv)"
        type: choice
        options:
          - schedule
          - payment-driven
        default: schedule

permissions:
  contents: write

# Never let a manual dispatch overlap the scheduled run (double-send +
# log-commit race). Let an in-progress run finish rather than cancel it.
concurrency:
  group: weekly-billing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: billing/bot/package.json

      - name: Install dependencies
        working-directory: billing/bot
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Prepare billing reconciliation without sending
        working-directory: billing/bot
        env:
          # ROLLOUT SAFETY: committed defaults are the proven paths.
          # Scheduled Friday runs have no inputs, so they fall back to
          # BILLING_MODE=schedule + APPOINTMENT_SOURCE=ical. Brad flips to
          # payment-driven via a manual workflow_dispatch after a dry-run.
          BILLING_MODE: ${{ github.event.inputs.billing_mode || 'schedule' }}
          APPOINTMENT_SOURCE: ${{ github.event.inputs.appointment_source || 'ical' }}
          VAGARO_ICAL_URL: ${{ secrets.VAGARO_ICAL_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TOKEN_EXPIRES: ${{ secrets.GOOGLE_TOKEN_EXPIRES }}
          BILLING_DELIVERY_PHASE: prepare
          GITHUB_TOKEN: ${{ github.token }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          BILLING_PACIFIC_WEEK: "true"
          BILLING_PERIOD_END: ${{ github.event.inputs.period_end || '' }}
          # Payment email search remains independently 21 days.
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '5' }}
          EMAIL_STYLE: ${{ github.event.inputs.email_style || 'command-center' }}
        run: npm start

      - name: Persist weekly log and ledger before delivery
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "yeagers-gym-bot"
          git config user.email "bot@yeagersgym.com"
          base=$(git rev-parse HEAD)
          git add billing/logs/ billing/matched-payments.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly billing log + ledger $(date -u +%Y-%m-%d)"
          else
            echo "No log/ledger changes to commit"
          fi
          # Remote billing changes invalidate prepared evidence; raw events
          # and delivery markers can advance main without changing it.
          for attempt in 1 2 3; do
            git fetch origin main
            changed=$(git diff --name-only "$base" origin/main -- billing/ ':!billing/vagaro-events/' ':!billing/outbox/')
            if [ -n "$changed" ]; then echo "Billing evidence changed remotely; delivery blocked"; exit 1; fi
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          echo "BILLING_SNAPSHOT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Claim weekly delivery and record provider acceptance
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: billing/bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node delivery.mjs
