name: Weekly billing reconciliation

on:
  schedule:
    # Fridays at 17:00 UTC = 10 AM PDT (summer) / 9 AM PST (winter).
    # GitHub Actions cron runs in UTC with no DST awareness; the 1-hour
    # winter shift is acceptable.
    - cron: "0 17 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print email, do not send)"
        type: boolean
        default: false
      lookback_days:
        description: "Days of history to reconcile"
        type: string
        default: "8"
      email_style:
        description: "Email template"
        type: choice
        options:
          - default
          - command-center
        default: command-center
      appointment_source:
        description: "Where appointments come from (ical = proven path; vagaro-events = Phase 3 webhook feed)"
        type: choice
        options:
          - ical
          - vagaro-events
        default: ical
      billing_mode:
        description: "schedule = roster/iCal model; payment-driven = money-in + history-based chase (no schedule.csv)"
        type: choice
        options:
          - schedule
          - payment-driven
        default: schedule

permissions:
  contents: write

# Never let a manual dispatch overlap the scheduled run (double-send +
# log-commit race). Let an in-progress run finish rather than cancel it.
concurrency:
  group: weekly-billing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: billing/bot/package.json

      - name: Install dependencies
        working-directory: billing/bot
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Run billing reconciliation
        working-directory: billing/bot
        env:
          # ROLLOUT SAFETY: committed defaults are the proven paths.
          # Scheduled Friday runs have no inputs, so they fall back to
          # BILLING_MODE=schedule + APPOINTMENT_SOURCE=ical. Brad flips to
          # payment-driven via a manual workflow_dispatch after a dry-run.
          BILLING_MODE: ${{ github.event.inputs.billing_mode || 'schedule' }}
          APPOINTMENT_SOURCE: ${{ github.event.inputs.appointment_source || 'ical' }}
          VAGARO_ICAL_URL: ${{ secrets.VAGARO_ICAL_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TOKEN_EXPIRES: ${{ secrets.GOOGLE_TOKEN_EXPIRES }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '8' }}
          EMAIL_STYLE: ${{ github.event.inputs.email_style || 'command-center' }}
        run: npm start

      - name: Commit weekly log + matched-payments ledger
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "yeagers-gym-bot"
          git config user.email "bot@yeagersgym.com"
          git add billing/logs/ billing/matched-payments.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly billing log + ledger $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No log/ledger changes to commit"
          fi
