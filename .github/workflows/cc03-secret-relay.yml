name: CC-03 encrypted private billing migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install encryption library
        run: python3 -m pip install --disable-pip-version-check --quiet --target /tmp/cc03-nacl PyNaCl==1.6.2
      - name: Seal existing billing secrets to private repository key
        env:
          PYTHONPATH: /tmp/cc03-nacl
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TOKEN_EXPIRES: ${{ secrets.GOOGLE_TOKEN_EXPIRES }}
          VAGARO_ICAL_URL: ${{ secrets.VAGARO_ICAL_URL }}
        run: |
          python3 - <<'PY'
          import os,json,base64
          from nacl.public import PublicKey,SealedBox
          from nacl.encoding import Base64Encoder
          names=['BREVO_API_KEY','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','GOOGLE_REFRESH_TOKEN','GOOGLE_TOKEN_EXPIRES','VAGARO_ICAL_URL']
          missing=[name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing configured secret names: '+','.join(missing))
          box=SealedBox(PublicKey(b'ENy+JwFSY2ACuPoB2MGGOpVgp5BPmnmuUpqT4Aee0EE=',Base64Encoder))
          sealed={name:base64.b64encode(box.encrypt(os.environ[name].encode())).decode() for name in names}
          with open('/tmp/cc03-relay.json','w') as file:
              json.dump({'repository':'bradyeager/yeagers-gym-billing','key_id':'3380204578043523366','sealed':sealed},file)
          print('Six secrets encrypted to destination key; no plaintext exported.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cc03-private-key-ciphertext
          path: /tmp/cc03-relay.json
          retention-days: 1
          if-no-files-found: error
