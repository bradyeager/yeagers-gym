name: Webhook archive validation
on:
  push:
    branches: [main]
    paths: ['vagaro-webhook/**', '.github/workflows/billing-reliability.yml']
  pull_request:
    paths: ['vagaro-webhook/**', '.github/workflows/billing-reliability.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Test webhook with mock storage
        run: node --test vagaro-webhook/webhook.test.mjs
