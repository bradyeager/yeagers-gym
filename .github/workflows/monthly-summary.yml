name: Monthly billing summary

on:
  schedule:
    # 1st of every month at 17:00 UTC (10 AM PT summer / 9 AM PT winter).
    - cron: "0 17 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print email, do not send)"
        type: boolean
        default: false
      month_offset:
        description: "Month offset (-1 = prior month; other offsets are dry-run-only)"
        type: string
        default: "-1"

permissions:
  # Proposed for review: the existing workflow token must create durable claims.
  contents: write

concurrency:
  group: monthly-summary
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: billing/bot/package.json

      - name: Install dependencies
        working-directory: billing/bot
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Prepare monthly summary without sending
        id: prepare_monthly
        working-directory: billing/bot
        env:
          MONTHLY_DELIVERY_PHASE: prepare
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MONTH_OFFSET: ${{ github.event.inputs.month_offset || '-1' }}
        run: npm run monthly

      - name: Claim monthly delivery and record provider acceptance
        if: ${{ github.event.inputs.dry_run != 'true' && steps.prepare_monthly.outputs.prepared == 'true' }}
        working-directory: billing/bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node monthly-delivery.mjs
