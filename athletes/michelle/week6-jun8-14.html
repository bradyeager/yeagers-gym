      --pink: #EF3295;
      --purple: #9B6FD4;
      --charcoal: #0F1620;
      --surface: #151F2E;
      --surface-2: #1C2A3D;
      --surface-3: #111927;
      --text: #E8EBF0;
      --text-dim: #7A8A9E;
      --green: #22C55E;
      --yellow: #EAB308;
      --orange: #F97316;
      --red: #EF4444;
      --border: rgba(255,255,255,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--charcoal); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; line-height: 1.55; font-size: 15px; }

    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { max-width: 900px; margin: 0 auto; padding: 0 1rem; }

    /* NAV */
    .nav { background: var(--surface); border-bottom: 1px solid rgba(72,196,204,0.18); padding: 0.65rem 0; position: sticky; top: 0; z-index: 100; }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.16em; color: var(--teal); text-transform: uppercase; }
    .nav-right { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }

    /* WEEK HEADER */
    .week-header { padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--border); }
    .week-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.22em; color: var(--teal); text-transform: uppercase; margin-bottom: 0.4rem; }
    .week-title { font-family: 'DM Serif Display', serif; font-size: 2.4rem; color: var(--text); line-height: 1.1; margin-bottom: 0.65rem; }
    .week-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.22rem 0.55rem; border-radius: 3px; }
    .tag-theme { background: rgba(239,50,149,0.08); color: var(--pink); border: 1px solid rgba(239,50,149,0.2); }
    .tag-default { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
    .tag-teal { background: rgba(72,196,204,0.07); color: var(--teal); border: 1px solid rgba(72,196,204,0.2); }

    /* E1RM SECTION */
    .section { padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
    .section-label { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem; }
    .e1rm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.5rem; }
    .e1rm-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.65rem 0.8rem; }
    .e1rm-name { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.3rem; }
    .e1rm-val { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 700; color: var(--teal); line-height: 1; }
    .e1rm-unit { font-size: 0.6rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
    .e1rm-note { font-size: 0.72rem; color: var(--text-dim); font-style: italic; margin-top: 0.4rem; }

    /* SESSION */
    .session-block { padding: 1.5rem 0; border-bottom: 1px solid var(--border); }
    .session-hd { background: var(--surface-2); border-left: 3px solid var(--teal); padding: 0.9rem 1.1rem; border-radius: 0 6px 6px 0; margin-bottom: 1.25rem; }
    .session-num { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); margin-bottom: 0.2rem; }
    .session-title { font-family: 'DM Serif Display', serif; font-size: 1.45rem; color: var(--text); }
    .session-meta-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.45rem; }

    /* LIFT CARD */
    .lift-wrap { margin-bottom: 1.25rem; }
    .lift-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; padding: 0.85rem 1rem 0.75rem; background: var(--surface); border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0; }
    .lift-hd-left { flex: 1; min-width: 0; }
    .lift-order-label { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.15rem; }
    .lift-name { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--text); }
    .badge-row { display: flex; flex-wrap: wrap; gap: 0.3rem; flex-shrink: 0; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.18rem 0.42rem; border-radius: 3px; white-space: nowrap; }
    .b-compound { background: rgba(72,196,204,0.08); color: var(--teal); border: 1px solid rgba(72,196,204,0.25); }
    .b-volume { background: rgba(239,50,149,0.08); color: var(--pink); border: 1px solid rgba(239,50,149,0.25); }
    .b-accessory { background: rgba(255,255,255,0.04); color: var(--text-dim); border: 1px solid rgba(255,255,255,0.1); }
    .b-vitruve { background: rgba(72,196,204,0.05); color: #6DD8DE; border: 1px solid rgba(72,196,204,0.18); }
    .b-lower { background: rgba(155,111,212,0.08); color: var(--purple); border: 1px solid rgba(155,111,212,0.22); }
    .b-upper { background: rgba(239,50,149,0.06); color: #F472B6; border: 1px solid rgba(239,50,149,0.15); }
    .b-e1rm { background: rgba(72,196,204,0.05); color: var(--text-dim); border: 1px solid var(--border); }

    .lift-body { background: var(--surface); border: 1px solid var(--border); border-top: 1px solid rgba(255,255,255,0.03); border-radius: 0 0 6px 6px; padding: 0 1rem 1rem; }

    /* Coach flag */
    .coach-flag { margin: 0.75rem 0; padding: 0.6rem 0.8rem; background: rgba(239,50,149,0.05); border-left: 2px solid var(--pink); border-radius: 0 4px 4px 0; }
    .coach-flag-lbl { font-family: 'JetBrains Mono', monospace; font-size: 0.52rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--pink); margin-bottom: 0.25rem; }
    .coach-flag-txt { font-size: 0.8rem; color: var(--text); line-height: 1.55; }

    /* Sub-section */
    .sub { margin-top: 0.9rem; }
    .sub-lbl { font-family: 'JetBrains Mono', monospace; font-size: 0.52rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; margin-bottom: 0.5rem; }

    /* Warm-up table */
    table.wu { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    table.wu th { font-family: 'JetBrains Mono', monospace; font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--border); }
    table.wu td { padding: 0.3rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.025); vertical-align: top; }
    table.wu tr:last-child td { border-bottom: none; }
    .wu-load { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text); }
    .wu-vel { font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; color: var(--teal); }
    .wu-pct { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim); }
    .wu-note { font-size: 0.72rem; color: var(--text-dim); font-style: italic; margin-top: 0.2rem; }

    /* Readiness */
    .readiness-box { display: flex; align-items: center; flex-wrap: wrap; gap: 0.75rem; padding: 0.6rem 0.8rem; background: rgba(72,196,204,0.03); border: 1px solid rgba(72,196,204,0.15); border-radius: 6px; }
    .r-load { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--teal); white-space: nowrap; }
    .r-detail { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-dim); }
    .r-note { font-size: 0.75rem; color: var(--text-dim); font-style: italic; width: 100%; }

    /* Decision tree */
    .decision { display: flex; flex-direction: column; gap: 0.3rem; }
    .d-row { display: flex; align-items: baseline; gap: 0.55rem; padding: 0.38rem 0.65rem; border-radius: 4px; font-size: 0.8rem; line-height: 1.45; }
    .d-green  { background: rgba(34,197,94,0.06);  border-left: 2px solid var(--green); }
    .d-yellow { background: rgba(234,179,8,0.06);  border-left: 2px solid var(--yellow); }
    .d-orange { background: rgba(249,115,22,0.06); border-left: 2px solid var(--orange); }
    .d-red    { background: rgba(239,68,68,0.06);  border-left: 2px solid var(--red); }
    .d-key { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; font-weight: 700; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.04em; }
    .d-green  .d-key { color: var(--green); }
    .d-yellow .d-key { color: var(--yellow); }
    .d-orange .d-key { color: var(--orange); }
    .d-red    .d-key { color: var(--red); }
    .d-txt { color: var(--text); }

    /* Working sets */
    .ws-box { background: rgba(72,196,204,0.04); border: 1px solid rgba(72,196,204,0.18); border-radius: 6px; padding: 0.8rem 1rem; }
    .ws-main { font-family: 'JetBrains Mono', monospace; font-size: 1.35rem; font-weight: 700; color: var(--text); margin-bottom: 0.35rem; }
    .ws-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .ws-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 0.18rem 0.5rem; background: rgba(72,196,204,0.07); color: var(--teal); border-radius: 3px; }
    .ws-note { font-size: 0.74rem; color: var(--text-dim); font-style: italic; margin-top: 0.4rem; }

    /* Caps */
    .cap-row { display: flex; gap: 0.4rem; margin-top: 0.45rem; flex-wrap: wrap; }
    .cap { font-family: 'JetBrains Mono', monospace; font-size: 0.56rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.18rem 0.5rem; border-radius: 3px; }
    .cap-vl   { background: rgba(234,179,8,0.07);  color: var(--yellow); border: 1px solid rgba(234,179,8,0.2); }
    .cap-stop { background: rgba(239,68,68,0.07);  color: var(--red);    border: 1px solid rgba(239,68,68,0.2); }
    .cap-floor { background: rgba(234,179,8,0.07); color: var(--yellow); border: 1px solid rgba(234,179,8,0.2); }

    /* Bullet lists */
    .key-list, .ok-list { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; padding: 0; }
    .key-list li, .ok-list li { padding-left: 1.1rem; position: relative; font-size: 0.81rem; color: var(--text); line-height: 1.5; }
    .key-list li::before { content: '→'; position: absolute; left: 0; top: 0; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--teal); }
    .ok-list  li::before { content: '✓'; position: absolute; left: 0; top: 0; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--green); }

    /* Trajectory */
    .traj { font-size: 0.8rem; color: var(--text-dim); line-height: 1.7; padding: 0.55rem 0.8rem; background: rgba(255,255,255,0.015); border-left: 2px solid rgba(72,196,204,0.25); border-radius: 0 4px 4px 0; font-style: italic; }

    /* Protocol */
    .protocol-pill { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.18rem 0.55rem; background: rgba(239,50,149,0.07); color: var(--pink); border-radius: 3px; margin: 0.6rem 0 0.2rem; }
    .vel-floor { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; padding: 0.3rem 0.6rem; background: rgba(234,179,8,0.05); border: 1px solid rgba(234,179,8,0.15); border-radius: 4px; color: var(--yellow); margin-top: 0.4rem; }

    /* Accessory */
    .acc-rx { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--pink); padding: 0.4rem 0 0.2rem; }
    .acc-note { font-size: 0.8rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 0.5rem; }

    /* Footer */
    .footer { padding: 1.5rem 0 3rem; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: rgba(255,255,255,0.15); letter-spacing: 0.06em; }

    @media (max-width: 520px) {
      .week-title { font-size: 1.7rem; }
      .lift-hd { flex-direction: column; }
      .badge-row { flex-direction: row; }
      .ws-main { font-size: 1.1rem; }
    }
  </style>
</head>

// ─── RENDER HELPERS ──────────────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function badgeHtml(lift) {
  const t = lift.type;
  const typeCls = t === 'compound' ? 'b-compound' : t === 'volume' ? 'b-volume' : 'b-accessory';
  const typeLabel = t === 'compound' ? 'Compound' : t === 'volume' ? 'Volume / MMC' : 'Accessory';
  let out = `<span class="badge ${typeCls}">${typeLabel}</span>`;
  if (lift.pattern) {
    const patCls = lift.pattern === 'lower' ? 'b-lower' : 'b-upper';
    out += `<span class="badge ${patCls}">${lift.pattern}</span>`;
  }
  if (lift.vitruve) out += `<span class="badge b-vitruve">Vitruve</span>`;
  if (lift.e1rm)   out += `<span class="badge b-e1rm">e1RM ${lift.e1rm} lb</span>`;
  if (lift.grip_week) out += `<span class="badge b-accessory">Grip: ${esc(lift.grip_week)}</span>`;
  return out;
}

function warmupHtml(rows) {
  if (!rows || !rows.length) return '';
  const trs = rows.map(r => `
    <tr>
      <td class="wu-load">${r.load} lb</td>
      <td>${r.reps} reps</td>
      <td class="wu-vel">${esc(r.target)}</td>
      <td class="wu-pct">${r.pct}</td>
      ${r.note ? `<td class="wu-note">${esc(r.note)}</td>` : '<td></td>'}
    </tr>`).join('');
  return `
    <div class="sub">
      <div class="sub-lbl">Warm-Up</div>
      <table class="wu">
        <thead><tr><th>Load</th><th>Reps</th><th>Target Velocity</th><th>% e1RM</th><th></th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>`;
}

function readinessHtml(r) {
  if (!r) return '';
  return `
    <div class="sub">
      <div class="sub-lbl">Readiness Single / Double</div>
      <div class="readiness-box">
        <span class="r-load">${r.load} lb × ${r.reps}</span>
        <span class="r-detail">${esc(r.velocity)}</span>
        <span class="r-detail">${r.pct} of e1RM</span>
        ${r.note ? `<span class="r-note">${esc(r.note)}</span>` : ''}
      </div>
    </div>`;
}

function decisionHtml(d) {
  if (!d) return '';
  return `
    <div class="sub">
      <div class="sub-lbl">Decision Tree</div>
      <div class="decision">
        <div class="d-row d-green"><span class="d-key">Green</span><span class="d-txt">${esc(d.green)}</span></div>
        <div class="d-row d-yellow"><span class="d-key">Yellow</span><span class="d-txt">${esc(d.yellow)}</span></div>
        <div class="d-row d-orange"><span class="d-key">Orange</span><span class="d-txt">${esc(d.orange)}</span></div>
        <div class="d-row d-red"><span class="d-key">Red</span><span class="d-txt">${esc(d.red)}</span></div>
      </div>
    </div>`;
}

function workingSetsHtml(ws, vl_cap, hard_stop, velocity_floor) {
  if (!ws) return '';
  const main = `${ws.load} lb × ${ws.reps} — ${ws.sets} sets`;
  let capsHtml = '';
  if (vl_cap)       capsHtml += `<span class="cap cap-vl">VL Cap ${vl_cap}</span>`;
  if (hard_stop)    capsHtml += `<span class="cap cap-stop">Hard Stop: ${esc(hard_stop)}</span>`;
  if (velocity_floor) capsHtml += `<span class="cap cap-floor">Vel Floor: ${esc(velocity_floor)}</span>`;
  return `
    <div class="sub">
      <div class="sub-lbl">Working Sets</div>
      <div class="ws-box">
        <div class="ws-main">${main}</div>
        <div class="ws-tags">
          <span class="ws-tag">${esc(ws.velocity_range)}</span>
          <span class="ws-tag">${ws.pct} of e1RM</span>
        </div>
        ${ws.note ? `<div class="ws-note">${esc(ws.note)}</div>` : ''}
      </div>
      ${capsHtml ? `<div class="cap-row">${capsHtml}</div>` : ''}
    </div>`;
}

function listHtml(items, cls) {
  return `<ul class="${cls}">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
}

function compoundLiftHtml(lift) {
  return `
    <div class="lift-wrap">
      <div class="lift-hd">
        <div class="lift-hd-left">
          <div class="lift-order-label">Lift ${lift.order}</div>
          <div class="lift-name">${esc(lift.name)}</div>
        </div>
        <div class="badge-row">${badgeHtml(lift)}</div>
      </div>
      <div class="lift-body">
        ${lift.coach_flag ? `<div class="coach-flag"><div class="coach-flag-lbl">Coach Flag</div><div class="coach-flag-txt">${esc(lift.coach_flag)}</div></div>` : ''}
        ${warmupHtml(lift.warm_up)}
        ${readinessHtml(lift.readiness)}
        ${decisionHtml(lift.decision)}
        ${workingSetsHtml(lift.working_sets, lift.vl_cap, lift.hard_stop, null)}
        ${lift.execution_keys ? `<div class="sub"><div class="sub-lbl">Execution Keys</div>${listHtml(lift.execution_keys, 'key-list')}</div>` : ''}
        ${lift.success_looks_like ? `<div class="sub"><div class="sub-lbl">Success Looks Like</div>${listHtml(lift.success_looks_like, 'ok-list')}</div>` : ''}
        ${lift.trajectory ? `<div class="sub"><div class="sub-lbl">Trajectory</div><div class="traj">${esc(lift.trajectory)}</div></div>` : ''}
      </div>
    </div>`;
}

function volumeLiftHtml(lift) {
  return `
    <div class="lift-wrap">
      <div class="lift-hd">
        <div class="lift-hd-left">
          <div class="lift-order-label">Lift ${lift.order}</div>
          <div class="lift-name">${esc(lift.name)}</div>
        </div>
        <div class="badge-row">${badgeHtml(lift)}</div>
      </div>
      <div class="lift-body">
        ${lift.coach_flag ? `<div class="coach-flag"><div class="coach-flag-lbl">Coach Flag</div><div class="coach-flag-txt">${esc(lift.coach_flag)}</div></div>` : ''}
        ${lift.protocol ? `<div class="protocol-pill">${esc(lift.protocol)}</div>` : ''}
        ${warmupHtml(lift.warm_up)}
        ${workingSetsHtml(lift.working_sets, null, null, lift.velocity_floor)}
        ${lift.execution_keys ? `<div class="sub"><div class="sub-lbl">Execution Keys</div>${listHtml(lift.execution_keys, 'key-list')}</div>` : ''}
      </div>
    </div>`;
}

function accessoryLiftHtml(lift) {
  return `
    <div class="lift-wrap">
      <div class="lift-hd">
        <div class="lift-hd-left">
          <div class="lift-order-label">Lift ${lift.order}</div>
          <div class="lift-name">${esc(lift.name)}</div>
        </div>
        <div class="badge-row"><span class="badge b-accessory">Accessory</span></div>
      </div>
      <div class="lift-body">
        <div class="acc-rx">${esc(lift.prescription)}</div>
        ${lift.notes ? `<div class="acc-note">${esc(lift.notes)}</div>` : ''}
        ${lift.execution_keys ? `<div class="sub"><div class="sub-lbl">Execution Keys</div>${listHtml(lift.execution_keys, 'key-list')}</div>` : ''}
      </div>
    </div>`;
}

function liftHtml(lift) {
  if (lift.type === 'compound') return compoundLiftHtml(lift);
  if (lift.type === 'volume')   return volumeLiftHtml(lift);
  return accessoryLiftHtml(lift);
}

function sessionHtml(s) {
  return `
    <div class="session-block">
      <div class="session-hd">
        <div class="session-num">Session ${s.number}</div>
        <div class="session-title">${esc(s.day)}, ${esc(s.date)} &mdash; ${esc(s.type)}</div>
        <div class="session-meta-row">
          <span class="tag tag-default">Order: ${esc(s.order_note)}</span>
        </div>
      </div>
      ${s.lifts.map(liftHtml).join('')}
    </div>`;
}

function e1rmGridHtml(e1rms) {
  return e1rms.map(e => `
    <div class="e1rm-card">
      <div class="e1rm-name">${esc(e.name)}</div>
      <div class="e1rm-val">${e.val}<span class="e1rm-unit"> lb</span></div>
    </div>`).join('');
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────

function renderPage() {
  const m = WEEK.meta;
  document.getElementById('root').innerHTML = `
    <div class="container">
      <div class="week-header">
        <div class="week-eyebrow">Week ${m.week} &middot; ${esc(m.block)} &middot; ${esc(m.athlete)}</div>
        <div class="week-title">${esc(m.dates)}</div>
        <div class="week-tags">
          <span class="tag tag-theme">${esc(m.theme)}</span>
          <span class="tag tag-teal">VBT &mdash; Vitruve</span>
          <span class="tag tag-default">Generated ${esc(m.generated)}</span>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Current e1RM Snapshot</div>
        <div class="e1rm-grid">${e1rmGridHtml(WEEK.e1rms)}</div>
        <div class="e1rm-note">${esc(m.e1rm_note)}</div>
      </div>

      ${WEEK.sessions.map(sessionHtml).join('')}

      <div class="footer">
        Generated ${esc(m.generated)} &middot; Velocity source: ${esc(m.velocity_source)} &middot; Schema ${esc(WEEK.schema_version)}
      </div>
    </div>`;
}

renderPage();
