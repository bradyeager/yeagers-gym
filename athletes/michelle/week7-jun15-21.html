// ─── RENDER HELPERS ──────────────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function badgeHtml(lift) {
  const t = lift.type;
  const typeCls = t === 'compound' ? 'b-compound' : t === 'volume' ? 'b-volume' : 'b-accessory';
  const typeLabel = t === 'compound' ? 'Compound' : t === 'volume' ? 'Volume / MMC' : 'Accessory';
  let out = `<span class="badge ${typeCls}">${typeLabel}</span>`;
  if (lift.pattern) {
    const patCls = lift.pattern === 'lower' ? 'b-lower' : 'b-upper';
    out += `<span class="badge ${patCls}">${lift.pattern}</span>`;
  }
  if (lift.vitruve) out += `<span class="badge b-vitruve">Vitruve</span>`;
  if (lift.e1rm)   out += `<span class="badge b-e1rm">e1RM ${lift.e1rm} lb</span>`;
  if (lift.grip_week) out += `<span class="badge b-accessory">Grip: ${esc(lift.grip_week)}</span>`;
  return out;
}

function warmupHtml(rows) {
  if (!rows || !rows.length) return '';
  const trs = rows.map(r => `
    <tr>
      <td class="wu-load">${r.load} lb</td>
      <td>${r.reps} reps</td>
      <td class="wu-vel">${esc(r.target)}</td>
      <td class="wu-pct">${r.pct}</td>
      ${r.note ? `<td class="wu-note">${esc(r.note)}</td>` : '<td></td>'}
    </tr>`).join('');
  return `
    <div class="sub">
      <div class="sub-lbl">Warm-Up</div>
      <table class="wu">
        <thead><tr><th>Load</th><th>Reps</th><th>Target Velocity</th><th>% e1RM</th><th></th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>`;
}

function readinessHtml(r) {
  if (!r) return '';
  return `
    <div class="sub">
      <div class="sub-lbl">Readiness Single / Double</div>
      <div class="readiness-box">
        <span class="r-load">${r.load} lb × ${r.reps}</span>
        <span class="r-detail">${esc(r.velocity)}</span>
        <span class="r-detail">${r.pct} of e1RM</span>
        ${r.note ? `<span class="r-note">${esc(r.note)}</span>` : ''}
      </div>
    </div>`;
}

function decisionHtml(d) {
  if (!d) return '';
  return `
    <div class="sub">
      <div class="sub-lbl">Decision Tree</div>
      <div class="decision">
        <div class="d-row d-green"><span class="d-key">Green</span><span class="d-txt">${esc(d.green)}</span></div>
        <div class="d-row d-yellow"><span class="d-key">Yellow</span><span class="d-txt">${esc(d.yellow)}</span></div>
        <div class="d-row d-orange"><span class="d-key">Orange</span><span class="d-txt">${esc(d.orange)}</span></div>
        <div class="d-row d-red"><span class="d-key">Red</span><span class="d-txt">${esc(d.red)}</span></div>
      </div>
    </div>`;
}

function workingSetsHtml(ws, vl_cap, hard_stop, velocity_floor) {
  if (!ws) return '';
  const main = `${ws.load} lb × ${ws.reps} — ${ws.sets} sets`;
  let capsHtml = '';
  if (vl_cap)         capsHtml += `<span class="cap cap-vl">VL Cap ${vl_cap}</span>`;
  if (hard_stop)      capsHtml += `<span class="cap cap-stop">Hard Stop: ${esc(hard_stop)}</span>`;
  if (velocity_floor) capsHtml += `<span class="cap cap-floor">Vel Floor: ${esc(velocity_floor)}</span>`;
  return `
    <div class="sub">
      <div class="sub-lbl">Working Sets</div>
      <div class="ws-box">
        <div class="ws-main">${main}</div>
        <div class="ws-tags">
          <span class="ws-tag">${esc(ws.velocity_range)}</span>
          <span class="ws-tag">${ws.pct} of e1RM</span>
        </div>
        ${ws.note ? `<div class="ws-note">${esc(ws.note)}</div>` : ''}
      </div>
      ${capsHtml ? `<div class="cap-row">${capsHtml}</div>` : ''}
    </div>`;
}

function listHtml(items, cls) {
  return `<ul class="${cls}">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
}

function compoundLiftHtml(lift) {
  return `
    <div class="lift-wrap">
      <div class="lift-hd">
        <div class="lift-hd-left">
          <div class="lift-order-label">Lift ${lift.order}</div>
          <div class="lift-name">${esc(lift.name)}</div>
        </div>
        <div class="badge-row">${badgeHtml(lift)}</div>
      </div>
      <div class="lift-body">
        ${lift.coach_flag ? `<div class="coach-flag"><div class="coach-flag-lbl">Coach Flag</div><div class="coach-flag-txt">${esc(lift.coach_flag)}</div></div>` : ''}
        ${warmupHtml(lift.warm_up)}
        ${readinessHtml(lift.readiness)}
        ${decisionHtml(lift.decision)}
        ${workingSetsHtml(lift.working_sets, lift.vl_cap, lift.hard_stop, null)}
        ${lift.execution_keys ? `<div class="sub"><div class="sub-lbl">Execution Keys</div>${listHtml(lift.execution_keys, 'key-list')}</div>` : ''}
        ${lift.success_looks_like ? `<div class="sub"><div class="sub-lbl">Success Looks Like</div>${listHtml(lift.success_looks_like, 'ok-list')}</div>` : ''}
        ${lift.trajectory ? `<div class="sub"><div class="sub-lbl">Trajectory</div><div class="traj">${esc(lift.trajectory)}</div></div>` : ''}
      </div>
    </div>`;
}

function volumeLiftHtml(lift) {
  return `
    <div class="lift-wrap">
      <div class="lift-hd">
        <div class="lift-hd-left">
          <div class="lift-order-label">Lift ${lift.order}</div>
          <div class="lift-name">${esc(lift.name)}</div>
        </div>
        <div class="badge-row">${badgeHtml(lift)}</div>
      </div>
      <div class="lift-body">
        ${lift.coach_flag ? `<div class="coach-flag"><div class="coach-flag-lbl">Coach Flag</div><div class="coach-flag-txt">${esc(lift.coach_flag)}</div></div>` : ''}
        ${lift.protocol ? `<div class="protocol-pill">${esc(lift.protocol)}</div>` : ''}
        ${warmupHtml(lift.warm_up)}
        ${workingSetsHtml(lift.working_sets, null, null, lift.velocity_floor)}
        ${lift.execution_keys ? `<div class="sub"><div class="sub-lbl">Execution Keys</div>${listHtml(lift.execution_keys, 'key-list')}</div>` : ''}
      </div>
    </div>`;
}

function accessoryLiftHtml(lift) {
  return `
    <div class="lift-wrap">
      <div class="lift-hd">
        <div class="lift-hd-left">
          <div class="lift-order-label">Lift ${lift.order}</div>
          <div class="lift-name">${esc(lift.name)}</div>
        </div>
        <div class="badge-row"><span class="badge b-accessory">Accessory</span></div>
      </div>
      <div class="lift-body">
        <div class="acc-rx">${esc(lift.prescription)}</div>
        ${lift.notes ? `<div class="acc-note">${esc(lift.notes)}</div>` : ''}
        ${lift.execution_keys ? `<div class="sub"><div class="sub-lbl">Execution Keys</div>${listHtml(lift.execution_keys, 'key-list')}</div>` : ''}
      </div>
    </div>`;
}

function liftHtml(lift) {
  if (lift.type === 'compound') return compoundLiftHtml(lift);
  if (lift.type === 'volume')   return volumeLiftHtml(lift);
  return accessoryLiftHtml(lift);
}

function sessionHtml(s) {
  return `
    <div class="session-block">
      <div class="session-hd">
        <div class="session-num">Session ${s.number}</div>
        <div class="session-title">${esc(s.day)}, ${esc(s.date)} &mdash; ${esc(s.type)}</div>
        <div class="session-meta-row">
          <span class="tag tag-default">Order: ${esc(s.order_note)}</span>
        </div>
      </div>
      ${s.lifts.map(liftHtml).join('')}
    </div>`;
}

function e1rmGridHtml(e1rms) {
  return e1rms.map(e => `
    <div class="e1rm-card">
      <div class="e1rm-name">${esc(e.name)}</div>
      <div class="e1rm-val">${e.val}<span class="e1rm-unit"> lb</span></div>
    </div>`).join('');
}

function renderPage() {
  const m = WEEK.meta;
  document.getElementById('root').innerHTML = `
    <div class="container">
      <div class="week-header">
        <div class="week-eyebrow">Week ${m.week} &middot; ${esc(m.block)} &middot; ${esc(m.athlete)}</div>
        <div class="week-title">${esc(m.dates)}</div>
        <div class="week-tags">
          <span class="tag tag-theme">${esc(m.theme)}</span>
          <span class="tag tag-teal">VBT &mdash; Vitruve</span>
          <span class="tag tag-default">Generated ${esc(m.generated)}</span>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Current e1RM Snapshot</div>
        <div class="e1rm-grid">${e1rmGridHtml(WEEK.e1rms)}</div>
        <div class="e1rm-note">${esc(m.e1rm_note)}</div>
      </div>

      ${WEEK.sessions.map(sessionHtml).join('')}

      <div class="footer">
        Generated ${esc(m.generated)} &middot; Velocity source: ${esc(m.velocity_source)} &middot; Schema ${esc(WEEK.schema_version)}
      </div>
    </div>`;
}

renderPage();
